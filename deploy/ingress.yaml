apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: dubtracker
  namespace: dubtracker
  # TLS + Authelia (none, this one's public) stay at NPM on proxy01, which
  # proxies to this via the k8s_ingress upstream. See WikiJS kubernetes.md#ingress-npm.
spec:
  ingressClassName: nginx
  rules:
    - host: dubs.cineclark.studio
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: dubtracker
                port:
                  number: 80
